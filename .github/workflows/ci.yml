name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Fails on critical findings. The known high-severity advisories (braces, node-forge) are in
      # build tooling, have no upstream fix yet, and are listed in README.md under "Security".
      - run: npm audit --omit=dev --audit-level=critical
